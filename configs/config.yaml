paths:
  data:
    raw: data/raw
    processed: data/processed

  base:
    model: models/base/model_base.h5

  trained:
    model:  models/trained/model_trained.h5
    labels: models/trained/model_labels.txt

  artifactory:
    android: models/artifactory/android/object_classifier.tflite
    ios:     models/artifactory/ios/ObjectClassifier.mlpackage


inferences:
  - predict_class: tiger_cat
    path: assets/tiger-cat-inference.jpg
  - predict_class: tiger_cat
    path: assets/tiger-cat-inference.jpg
---
training:
  base_model_path: "models/base/model_base.h5"
  labels_url: https://storage.googleapis.com/download.tensorflow.org/data/ImageNetLabels.txt
  output:
    dir: "models/trained"
    model_name: "model_trained.h5"
    labels_name: "model_labels.txt"
  epochs: 10
  batch_size: 32
  learning_rate: 0.0001
  image_size: [224, 224]

conversion:
  input_model_path: "models/trained/model_trained.h5"
  input_labels_path: "models/trained/model_labels.txt"
  artifactory_dir: "models/artifactory"
  ios:
    model_name: "ObjectClassifier"
  android:
    model_name: "object_classifier"

inference:
  model_path: "models/trained/model_trained.h5"
  labels_path: "models/trained/model_labels.txt"
  image_size: [224, 224]
  predictions:
    - predict_class: tiger_cat
      path: assets/tiger-cat-inference.jpg
    - predict_class: tiger_cat
      path: assets/tiger-cat-inference.jpg
